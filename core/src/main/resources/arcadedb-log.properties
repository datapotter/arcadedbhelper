# A better default than the one arcadedb-engine ships, provided here so that every project depending
# on this library gets it without having to know about the problem.
#
# THE PROBLEM. arcadedb-engine bundles its own arcadedb-log.properties whose FileHandler pattern is
#     java.util.logging.FileHandler.pattern=./log/arcadedb.log
# "./log" is relative to the WORKING DIRECTORY, not the application home, so any process that opens
# an embedded database drops a log/ folder wherever it happened to be launched from. 58 of those
# accumulated across the code tree before anyone noticed. SERVER_ROOT_PATH does not affect it, and
# there is no GlobalConfiguration key for it - the pattern is a literal in the engine's own resource,
# with no ${...} placeholder, verified against 26.7.3. So the ONLY lever is which copy of this file
# wins on the classpath.
#
# WHAT THIS FILE CAN AND CANNOT PROMISE. It is a strong default, not a guarantee. Two resources now
# share the path `arcadedb-log.properties`, and getResourceAsStream returns the FIRST on the
# classpath. From an exploded classpath target/classes precedes lib/*, so an application's own copy
# beats this one, which beats the engine's. Inside a shaded uber-jar it is whichever the shade plugin
# merged first. If your project MUST be certain - and any project that actually gets launched should
# be - add the filter that removes the engine's copy outright:
#
#     <filter>
#         <artifact>com.arcadedb:arcadedb-engine</artifact>
#         <excludes><exclude>arcadedb-log.properties</exclude></excludes>
#     </filter>
#
# Layering is deliberate: ship your own file to override this one. Console-only is the right default
# for a library, because a library cannot know where its host wants logs to go - and writing them to
# a guessed relative path is exactly the bug being fixed.
#
# Verify with: exactly one arcadedb-log.properties in the shaded jar, and no log/ folder created after
# deleting it and running the app once.


handlers = java.util.logging.ConsoleHandler

.level = WARNING
com.arcadedb.level = WARNING
com.arcadedb.script.GraalPolyglotEngine.level = OFF
io.undertow.level = SEVERE
org.xnio.level = SEVERE
org.jboss.level = SEVERE

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
